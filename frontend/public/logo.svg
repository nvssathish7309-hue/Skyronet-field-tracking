    <!-- Top Red Radar Waves -->
    <path d="M 43 50 A 72 72 0 0 1 157 50" stroke="#ED2224" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 62 70 A 48 48 0 0 1 138 70" stroke="#ED2224" stroke-width="14" stroke-linecap="round" fill="none" />

