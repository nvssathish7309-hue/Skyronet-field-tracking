    <text x="150" y="72" font-family="'Orbitron', 'Rajdhani', 'Eurostile', 'Titillium Web', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="2">SKYRONET</text>
    <text x="152" y="98" font-family="'Orbitron', 'Rajdhani', 'Eurostile', 'Titillium Web', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="5.5">TECHNOLOGY</text>
