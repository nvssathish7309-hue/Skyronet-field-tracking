<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" fill="none">
  <!-- Wifi Emblem Container with White Wifi Icon -->
  <g transform="translate(5, 5)">
    <rect width="60" height="60" rx="16" fill="#2563eb" />
    <!-- White Top Signal Waves -->
    <path d="M 17 25 A 18 18 0 0 1 43 25" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 23 32 A 11 11 0 0 1 37 32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="30" cy="38" r="3" fill="#ffffff" />
    <!-- White Bottom Target Arcs -->
    <path d="M 20 44 A 14 14 0 0 0 40 44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- SKYRONET TECHNOLOGY in Solid BLACK Text -->
  <text x="80" y="38" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" fill="#000000" letter-spacing="1.5">SKYRONET</text>
  <text x="80" y="56" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#000000" letter-spacing="3.5">TECHNOLOGY</text>
</svg>
