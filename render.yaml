services:
  # 1. Backend Web Service
  - type: web
    name: skyronet-field-tracking-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: skyronet-field-tracking-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://skyronet-field-tracking-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://skyronet-field-tracking-backend.onrender.com
